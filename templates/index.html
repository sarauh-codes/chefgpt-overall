<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChefGPT Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

    <div class="container">
        <img src="https://img.icons8.com/fluency/200/bot.png" alt="ChefGPT Logo" class="logo-img">
        <h2>Login to ChefGPT</h2>
        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Links -->
        <p>
            <p> Don't have an account? </p>
            <a href="{{ url_for('register') }}">Register User</a> | 
            <a href="{{ url_for('register_admin') }}">Register Admin</a>
        </p>
    </div>
    {% endblock %}
</body>
</html>
