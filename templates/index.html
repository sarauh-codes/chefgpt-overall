<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChefGPT Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages" style="text-align: center; margin-bottom: 15px;">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" style="padding: 10px; border-radius: 5px; color: #fff; background-color: {% if category == 'success' %}#28a745{% else %}#dc3545{% endif %}; margin-bottom: 10px;">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="container">
        <img src="https://img.icons8.com/fluency/200/bot.png" alt="ChefGPT Logo" class="logo-img">
        <h2>Login to ChefGPT</h2>
        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Links -->
        <p>
            <p> Don't have an account? </p>
            <a href="{{ url_for('register') }}">Register User</a> | 
            <a href="{{ url_for('register_admin') }}">Register Admin</a>
        </p>
    </div>
</body>
</html>
