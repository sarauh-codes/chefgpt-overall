<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
{% extends "base.html" %}

{% block title %}Edit Recipe{% endblock %}

{% block content %}
<div class="section">
    <h2>Edit Recipe</h2>

    <form method="POST">
        <label>Name:</label>
        <input type="text" name="recipe_name" value="{{ recipe['recipe_name'] }}" required>

        <label>Ingredients:</label>
        <textarea name="ingredients" required>{{ recipe['ingredients'] }}</textarea>

        <label>Cuisine:</label>
        <input type="text" name="cuisine" value="{{ recipe['cuisine'] }}" required>

        <label>Calories:</label>
        <input type="number" name="calories" value="{{ recipe['calories'] }}" required>

        <label>Rating:</label>
        <input type="number" step="0.1" name="rating" value="{{ recipe['rating'] }}" required>

        <label>Difficulty:</label>
        <input type="text" name="difficulty" value="{{ recipe['difficulty'] }}" required>

        <label>Instructions:</label>
        <textarea name="instructions">{{ recipe['instructions'] }}</textarea>

        <button type="submit" class="btn save">Update Recipe</button>
        <button type="button" class="btn cancel" onclick="window.location.href='{{ url_for('manage_recipes') }}'">Back</button>
    </form>
</div>
{% endblock %}
</body>
</html>
