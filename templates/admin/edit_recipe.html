{% extends "admin/admin_base.html" %}

{% block title %}Edit Recipe - ChefGPT Admin{% endblock %}

{% block admin_content %}
    <header class="admin-header">
        <div>
            <h1>Edit Recipe</h1>
            <p class="header-sub">Update details for recipe #{{ recipe.recipe_id }}.</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('manage_recipes') }}" class="btn-secondary">← Back to Recipes</a>
        </div>
    </header>

    <div class="admin-form-container">
        <div class="admin-card">
            <form action="{{ url_for('edit_recipe', recipe_id=recipe.recipe_id) }}" method="POST" class="admin-form">
                <div class="form-group">
                    <label>Recipe Name</label>
                    <input type="text" name="recipe_name" value="{{ recipe.recipe_name }}" required>
                </div>
                
                <div class="form-group">
                    <label>Ingredients (comma separated)</label>
                    <textarea name="ingredients" required rows="3">{{ recipe.ingredients }}</textarea>
                </div>
                
                <div class="form-group">
                    <label>Instructions (separate steps with | )</label>
                    <textarea name="instructions" required rows="4">{{ recipe.instructions }}</textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Cuisine</label>
                        <input type="text" name="cuisine" value="{{ recipe.cuisine }}" required>
                    </div>
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" name="calories" value="{{ recipe.calories }}" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Rating (0-5)</label>
                        <input type="number" step="0.1" name="rating" value="{{ recipe.rating }}" required>
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select name="difficulty" required>
                            <option value="easy" {% if recipe.difficulty|lower == 'easy' %}selected{% endif %}>Easy</option>
                            <option value="medium" {% if recipe.difficulty|lower == 'medium' %}selected{% endif %}>Medium</option>
                            <option value="hard" {% if recipe.difficulty|lower == 'hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Image URL (Optional)</label>
                    <input type="url" name="image_url" value="{{ recipe.image_url if recipe.image_url and recipe.image_url != 'nan' else '' }}" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="{{ url_for('manage_recipes') }}" class="btn-secondary" style="text-decoration:none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
