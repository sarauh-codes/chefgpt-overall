{% extends "admin/admin_base.html" %}

{% block title %}Admin Profile - ChefGPT Admin{% endblock %}

{% block admin_content %}
<header class="admin-header">
    <div>
        <h1>Admin Profile</h1>
        <p class="header-sub">Update your administrator details and credentials.</p>
    </div>
</header>

<div class="admin-form-container" style="max-width: 600px; margin: 0 auto;">
    <div class="premium-card" style="background: white; border-radius: 24px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,0.03); border: 1px solid rgba(226,232,240,0.8);">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; margin: 0 auto 16px auto; box-shadow: 0 8px 24px rgba(99,102,241,0.3);">
                {{ current_user.username[0]|upper }}
            </div>
            <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px;">{{ current_user.username }}</h2>
            <p style="color: #64748b; margin-top: 4px; font-size: 14px;">Administrator</p>
        </div>

        <form action="{{ url_for('admin_profile') }}" method="POST">
            <div class="modern-group" style="margin-bottom: 20px;">
                <label style="font-weight: 700; font-size: 12px; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">Username</label>
                <input type="text" name="username" value="{{ current_user.username }}" required 
                       style="width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; background: #f8fafc; outline: none; transition: 0.2s;">
            </div>

            <div class="modern-group" style="margin-bottom: 20px;">
                <label style="font-weight: 700; font-size: 12px; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">Email Address</label>
                <input type="email" name="email" value="{{ current_user.email }}" required 
                       style="width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; background: #f8fafc; outline: none; transition: 0.2s;">
            </div>

            <div class="modern-group" style="margin-bottom: 30px;">
                <label style="font-weight: 700; font-size: 12px; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">New Password (leave blank to keep current)</label>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" name="password" placeholder="••••••••" 
                           style="width: 100%; padding: 14px 45px 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; background: #f8fafc; outline: none; transition: 0.2s; box-sizing: border-box;">
                    <button type="button" onclick="togglePassword()" title="Show Password"
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 18px; padding: 4px; box-shadow: none;">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
            </div>

            <script>
                function togglePassword() {
                    const passInput = document.getElementById('passwordInput');
                    const eyeIcon = document.getElementById('eyeIcon');
                    if (passInput.type === 'password') {
                        passInput.type = 'text';
                        eyeIcon.textContent = '🙈';
                    } else {
                        passInput.type = 'password';
                        eyeIcon.textContent = '👁️';
                    }
                }
            </script>

            <button type="submit" 
                    style="width: 100%; background: linear-gradient(135deg, #FF6B35, #F7931E); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 107, 53, 0.2); transition: 0.2s;">
                Save Changes
            </button>
        </form>
    </div>
</div>

<style>
    input:focus {
        border-color: #FF6B35 !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3) !important;
    }
</style>
{% endblock %}
