{% extends "admin/admin_base.html" %}

{% block title %}Add New Recipe - ChefGPT Admin{% endblock %}

{% block admin_content %}
    <header class="admin-header">
        <div>
            <h1>Add New Recipe</h1>
            <p class="header-sub">Add a new recipe to the global database.</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('manage_recipes') }}" class="btn-secondary">← Back to Recipes</a>
        </div>
    </header>

    <div class="admin-form-container">
        <div class="admin-card">
            <form action="{{ url_for('add_recipe') }}" method="POST" class="admin-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Recipe Name</label>
                    <input type="text" name="recipe_name" required placeholder="e.g. Classic Margherita Pizza">
                </div>
                
                <div class="form-group">
                    <label>Ingredients (comma separated)</label>
                    <textarea name="ingredients" required rows="3" placeholder="Flour, Tomatoes, Mozzarella, Basil, Olive Oil"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Instructions (separate steps with | )</label>
                    <textarea name="instructions" required rows="4" placeholder="Make dough | Add sauce | Bake for 10 minutes"></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Cuisine</label>
                        <input type="text" name="cuisine" required placeholder="e.g. Italian">
                    </div>
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" name="calories" required placeholder="e.g. 450">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Rating (0-5)</label>
                        <input type="number" step="0.1" name="rating" required placeholder="e.g. 4.8">
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select name="difficulty" required>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Recipe Image</label>
                    <div class="image-input-container" style="display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="file" name="image_file" accept="image/*" style="flex: 1;">
                            <span>OR</span>
                            <input type="url" name="image_url" placeholder="Paste Image URL" style="flex: 2;">
                        </div>
                        <small style="color: #64748b;">Upload a file from your computer or paste a web link.</small>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add Recipe</button>
                    <a href="{{ url_for('manage_recipes') }}" class="btn-secondary" style="text-decoration:none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
