{% extends "admin/admin_base.html" %}

{% block title %}Edit User - ChefGPT Admin{% endblock %}

{% block admin_content %}
    <header class="admin-header">
        <div>
            <h1>Edit User</h1>
            <p class="header-sub">Update details for {{ user.username }}.</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('manage_user') }}" class="btn-secondary">← Back to Users</a>
        </div>
    </header>

    <div class="admin-form-container">
        <div class="admin-card">
            <form action="{{ url_for('edit_user', user_id=user.id) }}" method="POST" class="admin-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ user.username }}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required>
                </div>
                
                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" name="role">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="{{ url_for('manage_user') }}" class="btn-secondary" style="text-decoration:none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
